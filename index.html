<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>파이트 아레나</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 한 화면에 한 장면만. 캐릭터 선택 → 세로로 긴 경기장(위) + 체력바(아래) 1:1 대결. 푸른 밤하늘 배경, 시작 버튼만 주황. 단일 다크 룩. */
:root {
  --bg: #ffffff;
  --panel: #eef5fd;
  --panel2: #dcecfb;
  --line: #b3cfee;
  --ink: #0f2447;
  --muted: #5b7399;
  --accent: #2d83dc;
  --cta: #ff9a2e;
  --cta-ink: #3a1c00;
  --hp: #3ddc84;
  --lag: #ff6b5e;
  --arena: #e4f3ff;
  --arena-grid: #c8e2f7;
  --f-display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--f-body);
  min-height: 100vh;
  padding-block: 62px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: 500 15px/1 var(--f-body); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 12px; min-height: 42px; padding: 0 16px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.cta { background: var(--cta); color: var(--cta-ink); border-color: var(--cta); font: 400 20px/1 var(--f-display); min-height: 50px; padding: 0 30px; box-shadow: 0 4px 0 #b86400; }
button.cta:hover { background: #ffab4d; }
button.cta:active { transform: translateY(2px); box-shadow: 0 2px 0 #b86400; }
h1, h2 { margin: 0; font-family: var(--f-display); font-weight: 400; text-wrap: balance; }

.set-btn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 20; display: inline-flex; align-items: center; gap: 6px; background: var(--bg); padding: 0 14px; }
.set-btn svg { width: 18px; height: 18px; flex: none; }
.set-panel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 60px); right: max(12px, env(safe-area-inset-right, 0px)); z-index: 20; width: min(300px, calc(100vw - 24px)); display: grid; gap: 16px; padding: 18px; border-radius: 16px; background: var(--bg); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--line); }
.set-panel h2 { font-size: 22px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.set-row label { font-weight: 500; }
.set-vol { display: grid; gap: 8px; }
.set-vol .top { display: flex; justify-content: space-between; align-items: center; }
.set-vol output { font-variant-numeric: tabular-nums; color: var(--muted); }
.set-vol input[type=range] { width: 100%; accent-color: var(--accent); }
.set-vol[data-off="1"] { opacity: 0.45; }
.switch { position: relative; width: 52px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: background 0.15s; }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(22px); }
.switch input:focus-visible + i { outline: 2px solid var(--ink); outline-offset: 2px; }
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: rgba(15,36,71,0.45); }
.modal-box { width: min(340px, 100%); max-height: calc(100dvh - 32px); overflow: auto; display: grid; gap: 14px; padding: 20px; border-radius: 16px; background: var(--bg); border: 2px solid var(--line); box-shadow: 0 6px 0 var(--line); }
.modal-box.wide { width: min(440px, 100%); }
.modal-box h2 { font-size: 24px; }
.modal-box p { margin: 0; color: var(--muted); font-size: 13px; }
.modal-box .btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.modal-box input { font: 400 16px/1 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 12px; width: 100%; }
.modal-box input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.modal-box .err { color: #d6303f; font-weight: 500; }
.adm-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; align-items: center; }
.adm-row label { font-weight: 500; overflow-wrap: anywhere; }
.adm-list { display: grid; gap: 8px; }
.screen { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }

/* ---------- 캐릭터 선택 ---------- */
.sel-head { display: grid; gap: 4px; text-align: center; }
.sel-head h1 { font-size: clamp(32px, 8vw, 44px); line-height: 1.1; }
.sel-head p { margin: 0; color: var(--muted); }
.slots { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.vs { font: 400 22px var(--f-display); color: var(--accent); }
.slot { display: grid; justify-items: center; gap: 6px; padding: 14px 8px 12px; border-radius: 16px; background: var(--panel); border: 2px solid var(--line); min-width: 0; }
.slot[aria-pressed="true"] { border-color: var(--accent); background: var(--panel2); }
.slot .tag { font-size: 12px; letter-spacing: 0.1em; color: var(--muted); }
.slot canvas { width: 92px; height: 92px; }
.slot .nm { font: 400 20px/1.1 var(--f-display); overflow-wrap: anywhere; text-align: center; }
.slots[data-n="4"] { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slots[data-n="4"] .slot { padding: 10px 4px 8px; border-radius: 14px; }
.slots[data-n="4"] .slot canvas { width: 64px; height: 64px; }
.slots[data-n="4"] .slot .nm { font-size: 16px; }
.chip[data-on="3"] { border-color: #2fa86a; background: rgba(47,168,106,0.16); }
.chip[data-on="4"] { border-color: #b655c4; background: rgba(182,85,196,0.16); }
.pl.dead { opacity: 0.4; }
.grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; padding: 14px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); }
.chip { display: grid; justify-items: center; gap: 4px; padding: 8px 2px 7px; min-height: 0; border-radius: 14px; border: 2px solid transparent; background: rgba(15,36,71,0.04); min-width: 0; }
.chip canvas { width: 100%; max-width: 60px; aspect-ratio: 1; }
.chip span { font-size: 12px; font-weight: 500; overflow-wrap: anywhere; text-align: center; }
.chip[data-on="1"] { border-color: var(--accent); background: rgba(92,192,255,0.16); }
.chip[data-on="2"] { border-color: var(--cta); background: rgba(255,154,46,0.16); }
.chip .badge { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); height: 12px; }
.sel-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.note { margin: 0; text-align: center; color: var(--muted); font-size: 13px; }

/* ---------- 경기 ---------- */
.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.hud b { color: var(--ink); font-weight: 700; }
#enrage { color: var(--lag); font-weight: 700; }
.arena-wrap { position: relative; width: min(100%, calc((100dvh - 250px) * 0.75)); min-width: 260px; margin: 0 auto; border-radius: 6px; border: 4px solid #6fb8ff; overflow: hidden; background: var(--arena); }
canvas#arena { display: block; width: 100%; aspect-ratio: 3 / 4; }
.result { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; text-align: center; background: rgba(255, 255, 255, 0.86); padding: 16px; }
.result .kicker { font-size: 13px; letter-spacing: 0.16em; color: var(--muted); }
.result .winner { font: 400 clamp(40px, 11vw, 64px)/1.1 var(--f-display); white-space: nowrap; }
.result .sub { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -4px; }
.result .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
.bars { width: min(100%, calc((100dvh - 250px) * 0.75)); min-width: 260px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl { display: grid; gap: 3px; min-width: 0; align-content: start; }
.pl .n { user-select: none; -webkit-user-select: none; font: 400 20px/1.1 var(--f-display); overflow-wrap: anywhere; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.pl.r .n { text-align: right; }
.track { position: relative; height: 22px; background: #c9d6ea; border-radius: 3px; overflow: hidden; border: 2px solid #0a1d44; }
.track i { position: absolute; inset: 0; transform-origin: left center; }
.track .lag { background: var(--lag); transition: transform 0.7s ease 0.25s; }
.track .fill { background: var(--hp); transition: transform 0.12s linear; }
.track em { position: absolute; inset: 0; display: grid; place-content: center; font: 700 12px/1 var(--f-body); font-style: normal; color: #06240f; font-variant-numeric: tabular-nums; }
.gauge { position: relative; height: 16px; margin-top: 1px; background: #c9d6ea; border: 2px solid #0a1d44; border-radius: 3px; overflow: hidden; }
.gauge i { position: absolute; inset: 0; background: #4f7dff; transform-origin: left center; transition: transform 0.12s linear; }
.gauge em { position: absolute; inset: 0; display: grid; place-content: center; font: 700 10px/1 var(--f-body); font-style: normal; color: #0a1d44; font-variant-numeric: tabular-nums; }
.tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-width: 48px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel2); font-weight: 700; box-shadow: inset 0 -2px 0 var(--accent); }

@media (max-width: 440px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px; gap: 6px; }
  .slot canvas { width: 76px; height: 76px; }
}
@media (prefers-reduced-motion: reduce) {
  .track .lag, .track .fill { transition: none; }
}
</style>

<button class="set-btn" id="setBtn" type="button" aria-expanded="false" aria-controls="setPanel">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
  설정
</button>
<div class="set-panel" id="setPanel" role="dialog" aria-label="설정" hidden>
  <h2>설정</h2>
  <div class="set-row">
    <label for="sfxOn">효과음 · 음악</label>
    <span class="switch"><input type="checkbox" id="sfxOn" checked><i></i></span>
  </div>
  <div class="set-vol" id="volBox">
    <div class="top"><label for="sfxVol">소리 크기</label><output id="volOut" for="sfxVol">100%</output></div>
    <input type="range" id="sfxVol" min="0" max="100" step="5" value="100">
  </div>
  <button id="setClose" type="button">닫기</button>
</div>

<div class="modal" id="pwModal" hidden>
  <form class="modal-box" id="pwForm" role="dialog" aria-modal="true" aria-labelledby="pwTitle" autocomplete="off">
    <h2 id="pwTitle">관리자 확인</h2>
    <label for="pwInput">비밀번호</label>
    <input id="pwInput" type="password" inputmode="numeric" autocomplete="off">
    <p class="err" id="pwErr" role="alert" hidden>비밀번호가 맞지 않습니다.</p>
    <div class="btns"><button type="button" id="pwCancel">취소</button><button class="cta" type="submit">확인</button></div>
  </form>
</div>
<div class="modal" id="adminModal" hidden>
  <div class="modal-box wide" role="dialog" aria-modal="true" aria-labelledby="admTitle">
    <h2 id="admTitle">관리자</h2>
    <p>캐릭터가 한 번 부딪칠 때 상대에게 주는 대미지를 정합니다. 비워 두면 기본값(13 고정)이 적용됩니다. 바뀐 값은 바로 적용되고, 한 판이 끝나면 초기값으로 돌아갑니다.</p>
    <div class="adm-list" id="adminList"></div>
    <div class="btns"><button type="button" id="adminReset">초기값으로</button><button class="cta" type="button" id="adminClose">닫기</button></div>
  </div>
</div>

<main>
  <!-- 캐릭터 선택 -->
  <section class="screen" id="select" aria-label="캐릭터 선택">
    <div class="sel-head">
      <h1>파이트 아레나</h1>
      <p>인원을 고르고 싸울 캐릭터를 정하세요. 모두 능력이 없는 더미입니다.</p>
    </div>
    <div class="slots" id="slots" data-n="2"></div>
    <div class="grid" id="grid" role="group" aria-label="캐릭터 목록"></div>
    <p class="note" id="hint">1P를 고르는 중입니다. 캐릭터를 누르세요.</p>
    <div class="sel-actions">
      <div class="seg" id="countSeg" role="group" aria-label="인원">
        <button type="button" data-n="2" aria-pressed="true">2인전</button>
        <button type="button" data-n="4" aria-pressed="false">4인전</button>
      </div>
      <button id="rand" type="button">랜덤</button>
      <button class="cta" id="go" type="button">시작하기</button>
    </div>
  </section>

  <!-- 경기 -->
  <section class="screen" id="game" aria-label="경기" hidden>
    <div class="hud">
      <span>경기 시간 <b id="time">0:00.0</b></span>
      <span id="enrageBox" hidden>격분 <span id="enrage">×1.0</span></span>
    </div>
    <div class="arena-wrap">
      <canvas id="arena" role="img" aria-label="캐릭터들이 세로로 긴 경기장에서 부딪히며 싸웁니다"></canvas>
      <div class="result" id="result" role="status" aria-live="polite" hidden>
        <div class="kicker" id="rKicker">승리</div>
        <div class="winner" id="rWinner"></div>
        <div class="sub" id="rSub"></div>
        <div class="btns">
          <button class="cta" id="again" type="button">한 판 더</button>
          <button id="toSel" type="button">나가기</button>
        </div>
      </div>
    </div>
    <div class="bars" id="bars"></div>
    <div class="tools">
      <button id="pause" type="button">일시정지</button>
      <div class="seg" id="speedSeg">
        <button type="button" data-speed="1" aria-pressed="true">1×</button>
        <button type="button" data-speed="2" aria-pressed="false">2×</button>
        <button type="button" data-speed="3" aria-pressed="false">3×</button>
      </div>
      <button id="back" type="button">나가기</button>
    </div>
  </section>
</main>

  /* ---------- 캐릭터 그리기 (선택창과 경기장 공용) ---------- */
  function drawChar(g, c, x, y, r, o) {
    o = o || {};
    const fx = o.fx || 0, fy = o.fy || 0, hurt = !!o.hurt;
    g.save();
    g.lineCap = 'round'; g.lineJoin = 'round';
    if (false) {
      g.fillStyle = shade(c.color, 0.8);
      for (const s of [-1, 1]) {
        g.beginPath(); g.moveTo(x + s * r * 0.9, y - r * 0.2); g.lineTo(x + s * r * 0.72, y - r * 1.18); g.lineTo(x + s * r * 0.18, y - r * 0.88); g.closePath(); g.fill();
      }
    }
    g.fillStyle = c.color;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    const pic = c.pic ? PICS[c.pic] : null;
    if (pic && pic.complete && pic.naturalWidth) {
      g.save(); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.clip();

    return;

    const ink = '#14213d', ex = r * 0.34, ey = y - r * 0.08, ox = fx * r * 0.07, oy = fy * r * 0.07;
    g.strokeStyle = ink; g.fillStyle = ink; g.lineWidth = r * 0.08;
    const dot = (px, rad) => {
      g.fillStyle = ink; g.beginPath(); g.arc(px + ox, ey + oy, rad, 0, 7); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(px + ox - rad * 0.3, ey + oy - rad * 0.35, rad * 0.32, 0, 7); g.fill();
    };
    const arc = (px, up) => { g.beginPath(); g.arc(px, ey + (up ? r * 0.05 : -r * 0.02), r * 0.12, up ? Math.PI : 0, up ? 0 : Math.PI, false); g.stroke(); };
    if (hurt) {
      for (const s of [-1, 1]) {
        const p = x + s * ex;
        g.beginPath(); g.moveTo(p + s * r * 0.11, ey - r * 0.11); g.lineTo(p - s * r * 0.11, ey); g.lineTo(p + s * r * 0.11, ey + r * 0.11); g.stroke();

      g.fillStyle = ink; g.beginPath(); g.ellipse(x, y + r * 0.42, r * 0.1, r * 0.14, 0, 0, 7); g.fill();
    } else {
      const f = c.face;
      if (f === 1) { arc(x - ex, false); arc(x + ex, false); }
      else if (f === 7) { dot(x - ex, r * 0.09); arc(x + ex, true); }
      else if (f === 2) { dot(x - ex, r * 0.14); dot(x + ex, r * 0.14); }
      else dot(x - ex, r * 0.09), dot(x + ex, r * 0.09);
      if (f === 3) {
        g.lineWidth = r * 0.05;
        g.beginPath(); g.arc(x - ex, ey, r * 0.21, 0, 7); g.stroke();
        g.beginPath(); g.arc(x + ex, ey, r * 0.21, 0, 7); g.stroke();
        g.beginPath(); g.moveTo(x - ex + r * 0.21, ey); g.lineTo(x + ex - r * 0.21, ey); g.stroke();
      }
      if (f === 4) {
        g.lineWidth = r * 0.07;
        g.beginPath(); g.moveTo(x - ex - r * 0.14, ey - r * 0.3); g.lineTo(x - ex + r * 0.14, ey - r * 0.18); g.stroke();
        g.beginPath(); g.moveTo(x + ex + r * 0.14, ey - r * 0.3); g.lineTo(x + ex - r * 0.14, ey - r * 0.18); g.stroke();
      }
      if (f === 6) {
        g.fillStyle = 'rgba(255,110,150,0.55)';
        for (const s of [-1, 1]) { g.beginPath(); g.ellipse(x + s * r * 0.58, y + r * 0.22, r * 0.17, r * 0.1, 0, 0, 7); g.fill(); }
      }
      if (f === 5) {
        g.lineWidth = r * 0.04;
        for (const s of [-1, 1]) for (const d of [-0.08, 0.08]) { g.beginPath(); g.moveTo(x + s * r * 0.5, y + r * 0.28 + d * r); g.lineTo(x + s * r * 0.95, y + r * 0.28 + d * r * 3); g.stroke(); }

      const main = () => { ctx.beginPath(); ctx.moveTo(-h, 4); ctx.bezierCurveTo(-h * 0.5, -4, h * 0.3, 5, h, -2); };
      const forks = [[-0.4, -1, -0.55, -10], [0.15, 1, 0.3, 10], [0.6, 1, 0.74, -9], [1, -2, 1.2, -8]];
      const drawForks = () => { for (const f of forks) { ctx.beginPath(); ctx.moveTo(h * f[0], f[1]); ctx.lineTo(h * f[2], f[3]); ctx.stroke(); } };
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000'; ctx.lineWidth = 11; main(); ctx.stroke();
      ctx.lineWidth = 8; drawForks();
      ctx.strokeStyle = '#a98a64'; ctx.lineWidth = 7; main(); ctx.stroke();
      ctx.lineWidth = 4; drawForks();
      ctx.strokeStyle = '#c7a97f'; ctx.lineWidth = 2; main(); ctx.stroke();
      ctx.fillStyle = '#7a5c3c';
      for (const k of [[-0.55, 0], [0.1, 1], [0.6, 0]]) { ctx.beginPath(); ctx.arc(h * k[0], k[1], 1.6, 0, 7); ctx.fill(); }
    } else {
      ctx.beginPath(); ctx.rect(-h, -4, 17, 8); ctx.rect(-h + 15, -8, 5, 16); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-h + 20, -6); ctx.lineTo(h - 14, -6); ctx.lineTo(h, 0); ctx.lineTo(h - 14, 6); ctx.lineTo(-h + 20, 6); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#6b3b1a'; ctx.fillRect(-h, -4, 17, 8);
      ctx.fillStyle = '#555'; ctx.fillRect(-h + 15, -8, 5, 16);
      ctx.fillStyle = '#e6edf5';
      ctx.beginPath(); ctx.moveTo(-h + 20, -6); ctx.lineTo(h - 14, -6); ctx.lineTo(h, 0); ctx.lineTo(h - 14, 6); ctx.lineTo(-h + 20, 6); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawBone(x, y, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    const hl = BONE_L / 2;
    const shape = (pad) => {
      ctx.beginPath();
      ctx.rect(-hl, -4 - pad, hl * 2, 8 + 2 * pad);
      for (const sx of [-hl, hl]) for (const sy of [-5, 5]) { ctx.moveTo(sx + 7 + pad, sy); ctx.arc(sx, sy, 7 + pad, 0, Math.PI * 2); }
    };
    ctx.fillStyle = '#000'; shape(2.5); ctx.fill();
    ctx.fillStyle = '#fff'; shape(0); ctx.fill();
    ctx.restore();
  }
  function draw() {
    const sc = fit();
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    ctx.fillStyle = '#e4f3ff'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) wrap.style.transform = 'translate(' + (rand(-1, 1) * shake * 10).toFixed(1) + 'px,' + (rand(-1, 1) * shake * 10).toFixed(1) + 'px)';
    else if (wrap.style.transform) wrap.style.transform = '';

    for (const b of balls) {
      if (!b.alive) continue;
      const sp = Math.hypot(b.vx, b.vy) || 1;
      drawChar(ctx, b.c, b.x, b.y, R, { fx: b.vx / sp, fy: b.vy / sp, hurt: b.flash > 0.1 });
      if (b.c.soul) for (const w of b.orbit) drawWeapon(b, w);
      if (b.c.bones) {
        for (let k = 0; k < BONES; k++) {
          const a = b.boneAng + k * Math.PI * 2 / BONES;
          drawBone(b.x + Math.cos(a) * BONE_R, b.y + Math.sin(a) * BONE_R, a);
        }
      }
      if (phase === 'count') {
        const ca = Math.cos(b.ang), sa = Math.sin(b.ang);
        ctx.strokeStyle = '#000'; ctx.fillStyle = '#000'; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(b.x + ca * (R + 8), b.y + sa * (R + 8)); ctx.lineTo(b.x + ca * (R + 44), b.y + sa * (R + 44)); ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(b.x + ca * (R + 62), b.y + sa * (R + 62));
        ctx.lineTo(b.x + ca * (R + 40) - sa * 13, b.y + sa * (R + 40) + ca * 13);
        ctx.lineTo(b.x + ca * (R + 40) + sa * 13, b.y + sa * (R + 40) - ca * 13);
        ctx.closePath(); ctx.fill();
      }
    }
    for (const bl of blasts) {
      const dx = Math.cos(bl.ang), dy = Math.sin(bl.ang);
      if (bl.t < BLAST_FIRE) {
        ctx.save(); ctx.strokeStyle = bl.t < BLAST_AIM ? 'rgba(10,29,68,0.35)' : 'rgba(10,29,68,0.8)'; ctx.lineWidth = 3; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.moveTo(bl.x + dx * 55, bl.y + dy * 55); ctx.lineTo(bl.x + dx * 1600, bl.y + dy * 1600); ctx.stroke(); ctx.restore();
      } else {
        const age = bl.t - BLAST_FIRE, bw = BEAM_W * (age < 0.3 ? 1 : Math.max(0, 1 - (age - 0.3) / 0.2));
        ctx.save(); ctx.translate(bl.x + dx * 55, bl.y + dy * 55); ctx.rotate(bl.ang);
        ctx.fillStyle = '#000'; ctx.fillRect(0, -bw / 2 - 4, 1600, bw + 8);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, -bw / 2, 1600, bw);
        ctx.restore();
      }
      if (bl.t < BLAST_FIRE + BEAM_T && GB_IMG.complete && GB_IMG.naturalWidth) {
        const sc = Math.min(1, 0.3 + bl.t / 0.25 * 0.7), w = GB_W * sc, h = GB_H * sc;
        const jx = bl.t > BLAST_FIRE - 0.5 && bl.t < BLAST_FIRE ? rand(-2, 2) : 0;
        ctx.save(); ctx.translate(bl.x + jx, bl.y); ctx.rotate(bl.ang - Math.PI / 2);
        ctx.imageSmoothingEnabled = false; ctx.drawImage(GB_IMG, -w / 2, -h / 2, w, h); ctx.restore();
      }
    }
    for (const h of shots) {
      const cs = 5, ox = h.x - 3.5 * cs, oy = h.y - 3 * cs;
      ctx.fillStyle = '#ff1a1a';
      HEART.forEach((row, ry) => { for (let rx = 0; rx < 7; rx++) if (row[rx] === '1') ctx.fillRect(ox + rx * cs, oy + ry * cs, cs + 0.5, cs + 0.5); });
    }
    for (const p of parts) {
      ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
    for (const x of texts) {
      ctx.globalAlpha = clamp(x.life / (x.max * 0.4), 0, 1);
      label(x.text, x.x, x.y, x.size, x.color, x.rot);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    if (freeze) {
      const sb = freeze.b;
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 0, W, H);
      drawChar(ctx, sb.c, sb.x, sb.y, R, {});
      const msg = '하지만 버텨냈다';
      ctx.save();
      ctx.globalAlpha = Math.min(1, freeze.t / 0.25);
      ctx.font = '34px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const tw = ctx.measureText(msg).width;
      const tx = clamp(sb.x, tw / 2 + 14, W - tw / 2 - 14);
      const ty = sb.y - R - 40 < 30 ? sb.y + R + 40 : sb.y - R - 40;
      ctx.lineJoin = 'round'; ctx.lineWidth = 5; ctx.strokeStyle = '#000';
      ctx.strokeText(msg, tx, ty);
      ctx.fillStyle = '#ffffff'; ctx.fillText(msg, tx, ty);
      ctx.restore();
    }

    if (phase === 'count') {
      const c = cdT < 1 ? '3' : cdT < 2 ? '2' : cdT < 3 ? '1' : '시작!';
      const f = cdT < 3 ? cdT % 1 : (cdT - 3) / 0.7;
      const pop = reduced ? 1 : 1.35 - 0.35 * Math.min(1, f * 4);
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(pop, pop); ctx.translate(-W / 2, -H / 2);
      ctx.globalAlpha = cdT >= 3 ? clamp(1 - (f - 0.6) / 0.4, 0, 1) : 1;
      label(c, W / 2, H / 2, cdT < 3 ? 120 : 96, '#ff9a2e', 0);
      ctx.restore();
    }
  }

  const timeEl = $('#time'), enBox = $('#enrageBox'), enEl = $('#enrage');
  function updateUI() {
    timeEl.textContent = fmt(t);
    const en = enrage();
    enBox.hidden = en <= 1.001;
    if (!enBox.hidden) enEl.textContent = '×' + en.toFixed(1);
    balls.forEach((b, i) => {
      const u = ui[i]; if (!u) return;
      u.el.classList.toggle('dead', !b.alive);
      const hp = Math.ceil(b.hp);
      if (hp !== u.last) {
        u.last = hp;
        const sc = 'scaleX(' + clamp(b.hp / b.maxHp, 0, 1).toFixed(3) + ')';
        u.fill.style.transform = sc; u.lag.style.transform = sc;
        u.txt.textContent = hp + ' / ' + b.maxHp;
      }
      if (u.gi) {
        const g = Math.ceil(b.gauge);
        if (g !== u.glast) {
          u.glast = g;
          u.gi.style.transform = 'scaleX(' + clamp(b.gauge / b.gaugeMax, 0, 1).toFixed(3) + ')';
          u.gt.textContent = g + ' / ' + b.gaugeMax;
        }
      }
    });
  }
  function showResult() {
    shownResult = true;
    const w = winner;
    $('#rKicker').textContent = w ? '승리' : '결과';
    $('#rWinner').textContent = w ? w.name : '무승부';
    $('#rWinner').style.color = 'var(--ink)';
    $('#rSub').textContent = fmt(t) + (w ? ' · 남은 체력 ' + Math.ceil(w.hp) + ' / ' + w.maxHp : ' · 동시에 쓰러졌습니다');
    $('#result').hidden = false;
    fitText($('#rWinner'), 14); fitText($('#rSub'), 10);
  }
  // 글자가 너무 크면 줄 바꿈 대신 글씨 크기를 줄인다
  function fitText(el, min) {
    el.style.fontSize = '';
    const avail = $('#result').clientWidth - 32;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    while (el.offsetWidth > avail && fs > min) { fs -= 1; el.style.fontSize = fs + 'px'; }
  }

  let last = performance.now();
  function frame(now) {
    const rdt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (phase !== 'select') {
      if (!paused) {
        let rem = rdt * speedMul;
        while (rem > 1e-6) { const d = Math.min(1 / 120, rem); step(d); rem -= d; }
      }
      if (over && !shownResult && overT > 1) showResult();
      draw(); updateUI();
    }
    requestAnimationFrame(frame);
  }

  $('#go').addEventListener('click', startGame);
  $('#again').addEventListener('click', () => { initAudio(); newMatch(); });
  // 나가기: 선택 화면으로 나가며 게임 상태를 처음 상태로 되돌린다
  function resetAll() {
    resetDmg();
    stopMusic(0.2);
    paused = false; pausedByAdmin = false; $('#pause').textContent = '일시정지';
    speedMul = 1;
    $('#speedSeg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.speed === '1')));
    freeze = null; shots = []; blasts = []; balls = []; parts = []; texts = []; cd = [];
    t = 0; cdT = 0; over = false; overT = 0; shownResult = false; winner = null; shake = 0;
    wrap.style.transform = '';
    $('#result').hidden = true;
    pwModal.hidden = true; adminModal.hidden = true;
    sel = [0, 1];
    setCount(2);
    phase = 'select';
    showScreen('select');
  }
  $('#toSel').addEventListener('click', resetAll);
  $('#back').addEventListener('click', resetAll);
  $('#pause').addEventListener('click', () => { paused = !paused; $('#pause').textContent = paused ? '계속' : '일시정지'; });
  $('#speedSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    speedMul = Number(b.dataset.speed);
    $('#speedSeg').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  });

  /* ---------- 설정 ---------- */
  const setBtn = $('#setBtn'), setPanel = $('#setPanel'), sfxOn = $('#sfxOn'), sfxVol = $('#sfxVol'), volOut = $('#volOut'), volBox = $('#volBox');
  function syncSettings() {
    sfxOn.checked = cfg.on; sfxVol.value = cfg.vol; sfxVol.disabled = !cfg.on;
    volOut.textContent = cfg.vol + '%';
    volBox.dataset.off = cfg.on ? '' : '1';
  }
  function togglePanel(open) {
    setPanel.hidden = !open;
    setBtn.setAttribute('aria-expanded', String(open));
  }
  setBtn.addEventListener('click', () => togglePanel(setPanel.hidden));
  $('#setClose').addEventListener('click', () => { togglePanel(false); setBtn.focus(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !setPanel.hidden) { togglePanel(false); setBtn.focus(); } });
  document.addEventListener('pointerdown', (e) => {
    if (!setPanel.hidden && !setPanel.contains(e.target) && !setBtn.contains(e.target)) togglePanel(false);
  });
  sfxOn.addEventListener('change', () => { cfg.on = sfxOn.checked; syncSettings(); saveCfg(); if (cfg.on) { initAudio(); sfx(0.65); } });
  sfxVol.addEventListener('input', () => { cfg.vol = Number(sfxVol.value); volOut.textContent = cfg.vol + '%'; saveCfg(); });
  sfxVol.addEventListener('change', () => { initAudio(); lastSfx = 0; sfx(0.65); });
  syncSettings();

  /* ---------- 관리자 ---------- */
  const ADMIN_PW = '123123';
  const pwModal = $('#pwModal'), pwInput = $('#pwInput'), pwErr = $('#pwErr'), adminModal = $('#adminModal'), adminList = $('#adminList');
  const dmgInputs = CHARS.map((c, i) => {
    const row = document.createElement('div'); row.className = 'adm-row';
    const lb = document.createElement('label'); lb.htmlFor = 'dmg' + i; lb.textContent = c.name + ' ' + (i + 1);
    const inp = document.createElement('input');
    inp.type = 'number'; inp.id = 'dmg' + i; inp.min = '0'; inp.max = '999'; inp.step = '1'; inp.inputMode = 'numeric'; inp.placeholder = '기본 (' + DEFAULT_DMG + ')';
    inp.addEventListener('input', () => {
      const v = inp.value.trim();
      const n = Number(v);
      dmgCfg[i] = v === '' || !Number.isFinite(n) ? null : Math.max(0, Math.min(999, Math.round(n)));
      saveDmg();
    });
    row.append(lb, inp); adminList.appendChild(row);
    return inp;
  });
  function syncAdmin() { dmgInputs.forEach((inp, i) => { inp.value = dmgCfg[i] == null ? '' : String(dmgCfg[i]); }); }
  let pausedByAdmin = false;
  function resumeGame() { if (pausedByAdmin) { pausedByAdmin = false; paused = false; $('#pause').textContent = '일시정지'; } }
  function openPw() {
    if (!paused) { paused = true; pausedByAdmin = true; $('#pause').textContent = '계속'; }
    pwInput.value = ''; pwErr.hidden = true; pwModal.hidden = false; setTimeout(() => pwInput.focus(), 0);
  }
  function closePw() { pwModal.hidden = true; resumeGame(); }
  function openAdmin() { syncAdmin(); adminModal.hidden = false; }
  function closeAdmin() { adminModal.hidden = true; resumeGame(); }
  $('#pwForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (pwInput.value === ADMIN_PW) { pwModal.hidden = true; openAdmin(); }
    else { pwErr.hidden = false; pwInput.select(); }
  });
  // 경기 중 체력바 위 이름을 같은 쪽으로 10번 연속 누르면 비밀번호 창(경기는 자동 일시정지)
  let nameClicks = { k: -1, n: 0, t: 0 };
  $('#bars').addEventListener('click', (e) => {
    const el = e.target.closest('.n'); if (!el) return;
    const k = [...document.querySelectorAll('#bars .n')].indexOf(el);
    const now = performance.now();
    nameClicks = (nameClicks.k === k && now - nameClicks.t < 1500) ? { k, n: nameClicks.n + 1, t: now } : { k, n: 1, t: now };
    if (nameClicks.n >= 10) {
      nameClicks = { k: -1, n: 0, t: 0 };
      paused = true; $('#pause').textContent = '계속';
      openPw();
    }
  });
  $('#pwCancel').addEventListener('click', closePw);
  $('#adminClose').addEventListener('click', closeAdmin);
  let nameTaps = { n: 0, t: 0 };
  $('#bars').addEventListener('click', (e) => {
    if (!e.target.closest('.n') || !pwModal.hidden || !adminModal.hidden) return;
    const now = performance.now();
    nameTaps.n = now - nameTaps.t < 1500 ? nameTaps.n + 1 : 1;
    nameTaps.t = now;
    if (nameTaps.n >= 10) { nameTaps.n = 0; openPw(); }
  });
  $('#adminReset').addEventListener('click', () => { CHARS.forEach((c, i) => { dmgCfg[i] = dmgDefault(i); }); saveDmg(); syncAdmin(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePw(); closeAdmin(); } });

  buildSlots();
  renderSel();
  requestAnimationFrame((n) => { last = n; frame(n); });
})();
</script>

</body></html>
